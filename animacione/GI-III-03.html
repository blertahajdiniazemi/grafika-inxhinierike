/* Layout: a drafting board. The A3 sheet is the stage; a side panel narrates each construction step. */
:root {
  --bg: #e5e9e7;
  --panel: #f2f4f2;
  --paper: #fbfcfa;
  --ink: #1a1f24;
  --muted: #55606a;
  --rule: #c6cdca;
  --proj: #2a62c9;     /* blue pencil: projection and construction */
  --cut: #cc4a2e;      /* red pencil: cutting plane */
  --hl: #e59b2f;       /* marker: highlighted surface without a colour of its own */
  --solid: #c2ced8;    /* faces of the part without a name */
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-draft: 'VzIso', 'DejaVu Sans Condensed', 'Arial Narrow', sans-serif;
  --f-ballore: #59b7e8; --f-siper: #f39c33; --f-vrima30: #5bbf7f; --f-vrima14: #b48ddf; --f-fundi: #f2cf4a; --f-bllok-majtas: #7fd3cf; --f-baza-ball: #ee8fae; --f-kanal-mur: #c9a27e; --f-cut: #ef6b55;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1214; --panel: #151a1d; --paper: #1a2024; --ink: #e3e8eb; --muted: #97a3ab; --rule: #2c353a;
    --proj: #7ba6ff; --cut: #ff8064; --hl: #f0b450; --solid: #52677a; color-scheme: dark;
    --f-ballore: #3f9ed4; --f-siper: #e28a26; --f-vrima30: #44a86b; --f-vrima14: #9a76cc; --f-fundi: #d6b13a; --f-bllok-majtas: #4fb0ab; --f-baza-ball: #d6769a; --f-kanal-mur: #a7805f; --f-cut: #e05a45;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1214; --panel: #151a1d; --paper: #1a2024; --ink: #e3e8eb; --muted: #97a3ab; --rule: #2c353a;
  --proj: #7ba6ff; --cut: #ff8064; --hl: #f0b450; --solid: #52677a; color-scheme: dark;
  --f-ballore: #3f9ed4; --f-siper: #e28a26; --f-vrima30: #44a86b; --f-vrima14: #9a76cc; --f-fundi: #d6b13a; --f-bllok-majtas: #4fb0ab; --f-baza-ball: #d6769a; --f-kanal-mur: #a7805f; --f-cut: #e05a45;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1340px; margin: 0 auto; padding-block: 18px 32px; display: grid; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .03em; color: var(--muted); }
h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 3.2vw, 36px); line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.swatch.proj { border-color: var(--proj); border-top-style: dashed; }
.swatch.cut { border-color: var(--cut); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 18px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } }

.stage-col { min-width: 0; display: grid; gap: 10px; }
.stage {
  position: relative; width: 100%; aspect-ratio: 420 / 297; max-width: 100%;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden;
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.stage.dragging { cursor: grabbing; }
.stage > svg, .stage > canvas, .stage > .labels { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage > .labels { pointer-events: none; overflow: hidden; }

/* the sheet (line styles of vizatim_a3: ISO 128 line group 0.7) */
#sheet .paper { fill: var(--paper); }
#sheet polyline, #sheet polygon { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
#sheet .l-kontur, #sheet .l-trashe, #sheet .l-korniza { stroke-width: .7; }
#sheet .l-mesme { stroke-width: .5; }
#sheet .l-holle, #sheet .l-dore { stroke-width: .35; }
#sheet .l-fshehte { stroke-width: .35; stroke-dasharray: 4 1.5; stroke-linecap: butt; }
#sheet .l-aks, #sheet .l-prerje { stroke-width: .35; stroke-dasharray: 12 1.5 1 1.5; stroke-linecap: butt; }
#sheet .l-projektim { stroke-width: .18; }
#sheet polygon.fill { fill: var(--ink); stroke: none; }
#sheet text { fill: var(--ink); }
#sheet .sf { stroke: none; fill: var(--hl); fill-opacity: .82; }
#sheet .hl .hlface { fill: var(--hl); fill-opacity: .88; stroke: var(--hl); stroke-width: .35; stroke-linejoin: round; }
#sheet .hl .hlline { stroke: var(--hl); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: .95; fill: none; }
#sheet .construct polyline { stroke: var(--proj); stroke-width: .34; stroke-dasharray: 2 1.2; stroke-linecap: butt; }
#sheet .construct .cl-m { stroke-width: .45; stroke-dasharray: none; }
#sheet .construct .cltxt { fill: var(--proj); font-family: var(--font-draft); }
#sheet g[data-l] { opacity: 0; }
#sheet .sf[data-tag="ballore"] { fill: var(--f-ballore); }
#sheet .hl .hlface[data-tag="ballore"] { fill: var(--f-ballore); stroke: var(--f-ballore); }
#sheet .hl .hlline[data-tag="ballore"] { stroke: var(--f-ballore); }
#sheet .sf[data-tag="siper"] { fill: var(--f-siper); }
#sheet .hl .hlface[data-tag="siper"] { fill: var(--f-siper); stroke: var(--f-siper); }
#sheet .hl .hlline[data-tag="siper"] { stroke: var(--f-siper); }
#sheet .sf[data-tag="vrima30"] { fill: var(--f-vrima30); }
#sheet .hl .hlface[data-tag="vrima30"] { fill: var(--f-vrima30); stroke: var(--f-vrima30); }
#sheet .hl .hlline[data-tag="vrima30"] { stroke: var(--f-vrima30); }
#sheet .sf[data-tag="vrima14"] { fill: var(--f-vrima14); }
#sheet .hl .hlface[data-tag="vrima14"] { fill: var(--f-vrima14); stroke: var(--f-vrima14); }
#sheet .hl .hlline[data-tag="vrima14"] { stroke: var(--f-vrima14); }
#sheet .sf[data-tag="fundi"] { fill: var(--f-fundi); }
#sheet .hl .hlface[data-tag="fundi"] { fill: var(--f-fundi); stroke: var(--f-fundi); }
#sheet .hl .hlline[data-tag="fundi"] { stroke: var(--f-fundi); }
#sheet .sf[data-tag="bllok-majtas"] { fill: var(--f-bllok-majtas); }
#sheet .hl .hlface[data-tag="bllok-majtas"] { fill: var(--f-bllok-majtas); stroke: var(--f-bllok-majtas); }
#sheet .hl .hlline[data-tag="bllok-majtas"] { stroke: var(--f-bllok-majtas); }
#sheet .sf[data-tag="baza-ball"] { fill: var(--f-baza-ball); }
#sheet .hl .hlface[data-tag="baza-ball"] { fill: var(--f-baza-ball); stroke: var(--f-baza-ball); }
#sheet .hl .hlline[data-tag="baza-ball"] { stroke: var(--f-baza-ball); }
#sheet .sf[data-tag="kanal-mur"] { fill: var(--f-kanal-mur); }
#sheet .hl .hlface[data-tag="kanal-mur"] { fill: var(--f-kanal-mur); stroke: var(--f-kanal-mur); }
#sheet .hl .hlline[data-tag="kanal-mur"] { stroke: var(--f-kanal-mur); }
#sheet .sf[data-tag="cut"] { fill: var(--f-cut); }
#sheet .hl .hlface[data-tag="cut"] { fill: var(--f-cut); stroke: var(--f-cut); }
#sheet .hl .hlline[data-tag="cut"] { stroke: var(--f-cut); }

/* 3D-anchored labels */
.lab {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap;
  font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .02em; line-height: 1.15;
  color: var(--ink); background: color-mix(in srgb, var(--paper) 88%, transparent); padding: 2px 7px 3px; border-radius: 3px;
  border: 1px solid var(--rule); opacity: 0; will-change: transform, opacity;
}
.lab.proj { color: var(--proj); border-color: color-mix(in srgb, var(--proj) 45%, transparent); }
.lab.cut { color: var(--cut); border-color: color-mix(in srgb, var(--cut) 45%, transparent); }
.lab small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 11.5px; letter-spacing: 0; color: var(--muted); }
.hint {
  position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center;
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.hint svg { width: 16px; height: 16px; }
.nogl { position: absolute; left: 12px; right: 12px; top: 10px; font-size: 13px; color: var(--muted); }

/* controls */
.controls { display: flex; align-items: center; gap: 8px; }
.btn {
  appearance: none; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 4px;
  height: 38px; min-width: 38px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 14px/1 var(--font-display); letter-spacing: .04em; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .steps button:focus-visible, .scrub:focus-visible { outline: 2px solid var(--proj); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn.play { min-width: 92px; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.scrub { flex: 1; min-width: 0; height: 38px; display: flex; gap: 3px; align-items: center; cursor: pointer; touch-action: none; }
.seg { position: relative; height: 8px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.seg i { position: absolute; inset: 0; background: var(--ink); transform-origin: 0 50%; transform: scaleX(0); }
.clock { font: 500 13px/1 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }

/* side panel */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; display: grid; }
.cap { padding: 16px 18px 14px; border-bottom: 1px solid var(--rule); min-height: 214px; }
.stepno { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.cap h2 { margin: 4px 0 2px; font-family: var(--font-display); font-weight: 600; font-size: 27px; line-height: 1.1; text-wrap: balance; }
.term { font-family: var(--font-draft); font-size: 15px; color: var(--proj); min-height: 1.2em; }
.cap p { margin: 10px 0 0; font-size: 15.5px; line-height: 1.55; max-width: 62ch; }
.key { padding: 12px 18px 14px; border-bottom: 1px solid var(--rule); transition: opacity .4s; }
.key-title { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.key ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
.key li { display: flex; align-items: flex-start; gap: 7px; font-size: 13.5px; line-height: 1.25; }
.key li:last-child:nth-child(odd) { grid-column: 1 / -1; }
.key li i { flex: none; margin-top: 2px; width: 14px; height: 14px; border-radius: 3px; background: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent); }
.steps { list-style: none; margin: 0; padding: 8px; display: grid; gap: 1px; }
.steps button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; align-items: baseline; gap: 4px;
  background: none; border: 0; border-radius: 3px; color: var(--muted); padding: 5px 8px; cursor: pointer;
  font: 500 14.5px/1.3 var(--font-body);
}
.steps button b { font: 600 13px/1 var(--font-display); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.steps button:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
.steps button.done { color: var(--ink); }
.steps button.now { color: var(--ink); background: color-mix(in srgb, var(--proj) 13%, transparent); font-weight: 600; }
@media (max-width: 980px) {
  .cap { min-height: 0; }
  .steps { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
}
@media (max-width: 520px) {
  .btn.play { min-width: 74px; }
  .clock { display: none; }
  .cap h2 { font-size: 24px; }
  .lab { font-size: 12px; padding: 1px 5px 2px; }
  .lab small { display: none; }
}
</style>

al poshtë, rrafshi i profilit anash."]]},{"id":"pfront","dur":7.5,"caps":[[0.0,"Çdo brinjë projektohet drejt prapa, pingul me rrafshin vertikal."],[3.9,"Faqja blu del në madhësi të vërtetë; faqja portokalli e sipërme del vetëm si vijë."]]},{"id":"ptop","dur":9,"caps":[[0.0,"Tani shiko nga lart: çdo brinjë projektohet drejt poshtë, në rrafshin horizontal. Gjatësitë mbeten si në pamjen ballore."],[4.7,"Faqja portokalli del me rrethin Ø14; te skajet shihet fundi i verdhë i kanaleve."]]},{"id":"pside","dur":9,"title":"Projekto pamjen anësore","caps":[[0.0,"Shiko nga e majta: çdo brinjë projektohet djathtas, në rrafshin e profilit. Lartësitë mbeten si në pamjen ballore."],[4.7,"Balli rozë i bazamentit dhe faqja bruz e bllokut dalin në madhësi të vërtetë, me hapjen e kanalit."]]},{"id":"section-A","dur":14,"title":"Prerja e plotë A–A","caps":[[0.0,"Kanalet dhe vrima Ø14 nuk shihen nga përpara. Rrafshi prerës A kalon nëpër y = 21."],[3.0,"Imagjino që gjysma e përparme hiqet."],[5.0,"Vizohet vetëm sipërfaqja e kuqe, me vija në 45°, 3 mm larg."],[7.2,"Kjo është PRERJA A–A: kanalet L, vrima Ø14 dhe rrethi Ø30 shihen pa vija të fshehura."],[10.5,"Prerja imagjinohet vetëm për këtë pamje; gjysma kthehet në vend."]]},{"id":"section-B","dur":14,"title":"Gjysmëprerja B–B","caps":[[0.0,"Trupi është simetrik: nga e majta mjafton gjysmëprerja me rrafshin B, x = 40."],[3.0,"Hiqet vetëm çereku i përparmë i majtë."],[5.0,"Vizohet vetëm sipërfaqja e kuqe, jo rrafshi i simetrisë."],[7.2,"PRERJA B–B: djathtas prerja me vrimat, majtas pamja e jashtme, të ndara me vijën e aksit."],[10.5,"Edhe kjo prerje imagjinohet vetëm për këtë pamje."]]},{"id":"unfold","dur":8,"caps":[[0.0,"Afroji rrafshet te trupi, pastaj rrotullo rrafshin horizontal poshtë dhe rrafshin e profilit anash."],[4.2,"Në fletë, pamja nga lart del poshtë pamjes ballore, kurse pamja nga e majta në të djathtë të saj."]]},{"id":"align","dur":8,"caps":[[0.0,"Pamja nga lart është poshtë pamjes ballore: gjatësitë përputhen."],[2.5,"Në pamjen anësore lartësitë përputhen me pamjen ballore."],[4.6,"Thellësitë barten nga pamja nga lart te pamja anësore përmes vijës 45°."]]},{"id":"axes","dur":9,"title":"Akset dhe gjurmët","caps":[[0.0,"Tani vizatimi është bardhë e zi; vijat e aksit kalojnë nëpër simetritë dhe vrimat."],[3.2,"Gjurmët A dhe B në pamjen nga lart: vija të trasha, shigjeta e shkronja."],[5.9,"Mbi prerjet shkruhen titujt PRERJA A–A dhe PRERJA B–B."]]},{"id":"dims","dur":15,"caps":[[0.0,"Masat e përgjithshme: gjatësia 80, lartësia 48 dhe thellësia 42."],[3.0,"Bazamenti dhe blloku: lartësia 18 në prerjen A–A, gjatësia 50 nga lart."],[6.0,"Kanali L: thellësia 9, lartësia 20 dhe gjerësia 9 në prerjen A–A; gjerësia 20 nga lart."],[9.6,"Vrimat Ø30 e Ø14 janë në akset e simetrisë; aksi i Ø30 në lartësinë 27."],[12.2,"Çdo masë një herë: 30 = 48 − 18 nuk kuotohet, që të mos mbyllet zinxhiri."]]},{"id":"rough","dur":14.5,"caps":[[0.0,"Çdo sipërfaqe e përpunuar merr klasën e saj të ashpërsisë."],[2.8,"N6 në faqen e sipërme, në prerjen B–B ku ajo shihet si vijë."],[5.2,"N8 në vrimat Ø30 dhe Ø14, në të dyja prerjet."],[7.6,"N9 në fundin e kanalit, mbi vijën ndihmëse në prerjen A–A."],[10.0,"N12 në faqen e majtë të bllokut, me majën nga jashtë materialit."],[12.3,"Lart djathtas: N14 për sipërfaqet e tjera; në kllapa N6, N8, N9, N12."]]},{"id":"title"}],"dim_groups":[[0.0,["dim-front-1","dim-front-3","dim-side-1"]],[3.0,["dim-front-2","dim-top-1"]],[6.0,["dim-front-4","dim-front-5","dim-front-6","dim-top-2"]],[9.6,["dim-front-7","dim-side-2","dim-top-3"]]],"rough":[["N6",2.8,"N6"],["N8",5.2,"N8"],["N9",7.6,"N9"],["N12",10.0,"N12"]],"surfaces":[{"tag":"ballore","name":"Faqja ballore"},{"tag":"siper","name":"Faqja e sipërme"},{"tag":"vrima30","name":"Vrima Ø30"},{"tag":"vrima14","name":"Vrima Ø14"},{"tag":"fundi","name":"Fundi i kanaleve"},{"tag":"bllok-majtas","name":"Blloku: faqja e majtë"},{"tag":"baza-ball","name":"Ballët e bazamentit"},{"tag":"kanal-mur","name":"Muret e kanaleve"},{"tag":"cut","name"     const v = L.v.clone().project(cam3);
    const x = (v.x + 1) / 2 * sw, y = (1 - v.y) / 2 * shh;
    L.el.style.transform = L.below ? `translate(${x.toFixed(1)}px, ${(y + 8).toFixed(1)}px) translate(-50%, 0)` : `translate(${x.toFixed(1)}px, ${(y - 6).toFixed(1)}px) translate(-50%, -100%)`;
    L.el.style.opacity = o.toFixed(3); L.el._o = o;
  }
}

/* ------------------------------------------------------------------ captions & UI */
const stepno = document.getElementById('stepno'), capTitle = document.getElementById('captitle'), capTerm = document.getElementById('capterm'), capText = document.getElementById('captext'), clock = document.getElementById('clock');
let lastCap = '';
const chapterAt = g => CH.find(c => g < c.end) || CH[CH.length - 1];
function updateUI(g) {
  const c = chapterAt(g), i = CH.indexOf(c), t = g - c.start;
  let s = c.caps[0][1];
  for (const [t0, s_] of c.caps) if (t >= t0 - 1e-6) s = s_;
  const key = c.id + '|' + s;
  if (key !== lastCap) { lastCap = key; stepno.textContent = UI.step(i + 1, CH.length); capTitle.textContent = c.title; capTerm.textContent = c.term || ''; capText.textContent = s; }
  CH.forEach((ch, k) => { ch.fill.style.transform = `scaleX(${clamp((g - ch.start) / ch.dur, 0, 1).toFixed(4)})`; ch.btn.classList.toggle('now', k === i); ch.btn.classList.toggle('done', k < i); });
  const sec = Math.floor(g); clock.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  scrub.setAttribute('aria-valuenow', String(Math.round(g / TOTAL * 100)));
  scrub.setAttribute('aria-valuetext', `${UI.step(i + 1, CH.length)}: ${c.title}`);
}

/* ------------------------------------------------------------------ playback */
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let g = 0, playing = !reduce, last = performance.now();
const playBtn = document.getElementById('play'), playTxt = document.getElementById('playtxt'), playIcon = document.getElementById('playicon');
const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>', ICON_PLAY = '<path d="M7 4.5v15l12.5-7.5z"/>', ICON_REPLAY = '<path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.6A5 5 0 1 0 12 7v3L7.5 6 12 2z"/>';
function syncPlay() { const atEnd = g >= TOTAL - 1e-6; playIcon.innerHTML = playing ? ICON_PAUSE : (atEnd ? ICON_REPLAY : ICON_PLAY); playTxt.textContent = playing ? UI.pause : (atEnd ? UI.replay : UI.play); playBtn.setAttribute('aria-label', playTxt.textContent); }
function play() { if (g >= TOTAL - 1e-6) g = 0; playing = true; last = performance.now(); syncPlay(); dirty = true; }
function pause() { playing = false; syncPlay(); }
function seek(t) { g = clamp(t, 0, TOTAL); dirty = true; syncPlay(); }
playBtn.addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('next').addEventListener('click', () => { const i = CH.indexOf(chapterAt(g)); if (reduce) { seek(CH[Math.min(i + 1, CH.length - 1)].end - 0.001); pause(); return; } seek(i + 1 < CH.length ? CH[i + 1].start + 0.001 : TOTAL); });
document.getElementById('prev').addEventListener('click', () => { const c = chapterAt(g); let i = CH.indexOf(c); if (reduce) { seek(CH[Math.max(i - 1, 0)].end - 0.001); pause(); return; } if (g - c.start < 1.0 && i > 0) i -= 1; seek(CH[i].start + 0.001); });
function scrubTo(ev) { const r = scrub.getBoundingClientRect(); seek(clamp((ev.clientX - r.left) / r.width, 0, 1) * TOTAL); }
let scrubbing = false, wasPlaying = false;
scrub.addEventListener('pointerdown', ev => { scrubbing = true; wasPlaying = playing; pause(); scrub.setPointerCapture(ev.pointerId); scrubTo(ev); });
scrub.addEventListener('pointermove', ev => { if (scrubbing) scrubTo(ev); });
scrub.addEventListener('pointerup', () => { scrubbing = false; if (wasPlaying && g < TOTAL) play(); });
scrub.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight') { seek(g + 2); ev.preventDefault(); } if (ev.key === 'ArrowLeft') { seek(g - 2); ev.preventDefault(); } });
document.addEventListener('keydown', ev => { if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) return; if (ev.key === ' ' && ev.target === document.body) { ev.preventDefault(); playing ? pause() : play(); } });
// orbit by dragging (3D steps only); the part follows the finger
let drag = null;
stage.addEventListener('pointerdown', ev => { if (!has3d || tr.userW(g) < 0.5) return; drag = { x: ev.clientX, y: ev.clientY, az: userAz, el: userEl }; stage.setPointerCapture(ev.pointerId); stage.classList.add('dragging'); });
stage.addEventListener('pointermove', ev => { if (!drag) return; userAz = clamp(drag.az + (ev.clientX - drag.x) * 0.35, -80, 80); userEl = clamp(drag.el + (ev.clientY - drag.y) * 0.25, -30, 40); dirty = true; });
const endDrag = () => { drag = null; stage.classList.remove('dragging'); };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', () => { userAz = 0; userEl = 0; dirty = true; });

/* ------------------------------------------------------------------ theme */
function retheme() {
  readColors();
  if (!has3d) return;
  for (const m of mats) m.color.set(COL[m.colorKey]);
  for (const m of lineMats) m.color.set(COL[m.colorKey] || COL.ink);
  for (const s of SOLIDS) paintSolid(s, FOCUS, Math.max(0, s.dim), true);
  for (const m of FILLS) m.color.copy(faceColor(m.tag));
  dirty = true;
}
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ------------------------------------------------------------------ loop */
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !scrubbing) { g += dt; if (g >= TOTAL) { g = TOTAL; playing = false; syncPlay(); } dirty = true; }
  if (dirty) { applyState(g); if (has3d) { renderer.render(scene, cam3); placeLabels(g); } updateUI(g); dirty = false; }
  requestAnimationFrame(frame);
}
if (ok3d) { try { build3D(); has3d = true; } catch (err) { console.error(err); has3d = false; } }
if (!has3d) {
  canvas.style.display = 'none';
  for (const n of D.layers) if (/^(geom|hatch|hidden|free)-/.test(n)) LT[n] = () => 1;
  labelsEl.innerHTML = `<div class="nogl">${window.THREE ? UI.nogl : UI.no3dlib}</div>`;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize();
if (reduce) g = CH[0].end - 0.001;
syncPlay();
requestAnimationFrame(t => { last = t; frame(t); });
// test hooks
window.__seek = t => { seek(t); applyState(g); if (has3d) { renderer.render(scene, cam3); placeLabels(g); } updateUI(g); };
window.__chapters = CH.map(c => ({ id: c.id, start: c.start, end: c.end }));
window.__pause = pause; window.__total = TOTAL; window.__time = () => g;
window.__nearX = () => {              // screen x of the part's corner nearest to the camera (drag-direction test)
  if (!has3d) return null;
  const d = cam3.position.clone().sub(new THREE.Vector3(...tr.target(g))).normalize();
  let best = null, bd = -Infinity;
  for (const x of [bb[0][0], bb[1][0]]) for (const y of [bb[0][1], bb[1][1]]) for (const z of [bb[0][2], bb[1][2]]) {
    const v = new THREE.Vector3(x, y, z), s = v.dot(d); if (s > bd) { bd = s; best = v; }
  }
  window.__nearPt = window.__nearPt || best;
  return (window.__nearPt.clone().project(cam3).x + 1) / 2 * sw;
};
})();
</script>
